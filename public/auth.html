<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Digital Canteen Book</title>
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f0f2f5;color:#1e293b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08);width:100%;max-width:420px;overflow:hidden}
    .login-header{background:linear-gradient(135deg,#1e40af 0%,#2563eb 100%);color:#fff;padding:32px 24px;text-align:center}
    .login-header .logo{font-size:2.5rem;margin-bottom:8px}
    .login-header h1{font-size:1.4rem;font-weight:700;margin-bottom:4px}
    .login-header p{font-size:0.85rem;opacity:0.85}
    .login-body{padding:28px 24px}
    .form-group{margin-bottom:18px}
    .form-group label{display:block;font-size:0.8rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
    .form-group input,.form-group select{width:100%;padding:14px 16px;font-size:1rem;font-weight:600;border:2px solid #e2e8f0;border-radius:10px;outline:none;transition:border-color 0.2s}
    .form-group input:focus,.form-group select:focus{border-color:#2563eb}
    .login-btn{width:100%;padding:14px;font-size:1.05rem;font-weight:700;border:none;border-radius:10px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;cursor:pointer;transition:all 0.2s}
    .login-btn:hover{transform:translateY(-1px)}
    .login-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
    .create-btn{width:100%;padding:14px;font-size:1.05rem;font-weight:700;border:none;border-radius:10px;background:linear-gradient(135deg,#059669,#047857);color:#fff;cursor:pointer;transition:all 0.2s}
    .create-btn:hover{transform:translateY(-1px)}
    .create-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
    .error-msg{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 16px;color:#dc2626;font-size:0.85rem;font-weight:600;margin-bottom:16px;display:none;white-space:pre-line}
    .error-msg.show{display:block}
    .success-msg{background:#d1fae5;border:1px solid #6ee7b7;border-radius:8px;padding:12px 16px;color:#065f46;font-size:0.85rem;font-weight:600;margin-bottom:16px;display:none;white-space:pre-line}
    .success-msg.show{display:block}
    .tab-bar{display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:24px}
    .tab-btn{flex:1;padding:12px;font-size:0.95rem;font-weight:700;border:none;background:transparent;color:#64748b;cursor:pointer;transition:all 0.2s;border-bottom:3px solid transparent}
    .tab-btn.active{color:#2563eb;border-bottom-color:#2563eb}
    .tab-btn:hover:not(.active){color:#1e293b}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;margin-right:8px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    .security-note{margin-top:20px;padding:12px 16px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;font-size:0.78rem;color:#0369a1;text-align:center}
    .security-note strong{display:block;margin-bottom:2px}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="logo">🍽️</div>
      <h1>Digital Canteen Book</h1>
      <p>Admin Dashboard Access</p>
    </div>
    <div class="login-body">
      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('login')">🔑 Login</button>
        <button class="tab-btn" onclick="switchTab('register')">➕ Create Account</button>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>

      <!-- ═══ LOGIN TAB ═══ -->
      <div class="tab-content active" id="loginTab">
        <form id="loginForm" onsubmit="return false;">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required autocomplete="email" autofocus />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
        </form>
      </div>

      <!-- ═══ REGISTER TAB ═══ -->
      <div class="tab-content" id="registerTab">
        <form id="registerForm" onsubmit="return false;">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="Enter your full name" required autocomplete="name" />
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" placeholder="Enter your email" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Create a password (min 4 chars)" required autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="regConfirm" placeholder="Confirm your password" required autocomplete="new-password" />
          </div>
          <button type="submit" class="create-btn" id="regBtn">➕ Create Account</button>
        </form>
        <p style="text-align:center;margin-top:12px;font-size:0.8rem;color:#64748b;">
          After registration, wait for developer approval before you can login.
        </p>
      </div>

      <div class="security-note">
        <strong>🔒 Secure Access Only</strong>
        All accounts require developer approval before activation.
      </div>
      <p style="text-align:center;margin-top:16px;">
        <a href="#" onclick="fixDeveloperAccount()" style="font-size:0.78rem;color:#94a3b8;text-decoration:none;">🛠️ First time setup? Fix developer account</a>
      </p>
    </div>
  </div>

  <script>
    // ─── Fix Developer Account (first-time setup) ─────────
    async function fixDeveloperAccount() {
      if (!confirm('This will fix the developer account and remove all other users. Continue?')) return;
      try {
        const res = await fetch('/api/setup/fix-developer');
        const data = await res.json();
        if (data.success) {
          showSuccess('✅ ' + data.message + '\n\nEmail: ' + data.developer.email + '\nPassword: ' + data.developer.password + '\n\nNow login with these credentials!');
        } else {
          showError('❌ ' + (data.error || 'Failed'));
        }
      } catch(e) {
        showError('❌ Network error. Try again.');
      }
    }

    // ─── Tab Switching ──────────────────────────────────────
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      hideMessages();
      if (tab === 'login') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('loginTab').classList.add('active');
        document.getElementById('loginEmail').focus();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('registerTab').classList.add('active');
        document.getElementById('regName').focus();
      }
    }

    function showError(msg) {
      document.getElementById('errorMsg').textContent = msg;
      document.getElementById('errorMsg').classList.add('show');
      document.getElementById('successMsg').classList.remove('show');
    }
    function showSuccess(msg) {
      document.getElementById('successMsg').textContent = msg;
      document.getElementById('successMsg').classList.add('show');
      document.getElementById('errorMsg').classList.remove('show');
    }
    function hideMessages() {
      document.getElementById('errorMsg').classList.remove('show');
      document.getElementById('successMsg').classList.remove('show');
    }

    // ─── Login ─────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async () => {
      hideMessages();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) { showError('Please enter email and password.'); return; }

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in...';

      try {
        const res = await fetch('/api/users/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (data.success) {
          // Store credentials for auth.js
          localStorage.setItem('adminEmail', email);
          localStorage.setItem('adminPassword', password);
          localStorage.setItem('adminLoginTime', String(Date.now()));
          localStorage.setItem('adminUser', JSON.stringify(data.user));
          // Developer goes to developer page, others to entry page
          if (data.user && data.user.role === 'DEVELOPER') {
            window.location.href = '/developer';
          } else {
            window.location.href = '/';
          }
        } else if (data.status === 'pending') {
          showError('⏳ Your account is pending approval.\n\nPlease wait for the developer to approve your account before you can login.');
        } else if (data.status === 'paused') {
          showError('🚫 Your account has been paused.\n\nContact the developer to reactivate your account.');
        } else {
          showError(data.error || 'Invalid email or password.');
        }
      } catch (err) {
        showError('Login failed. Server may be starting up. Please wait and try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    document.getElementById('loginPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    });

    // ─── Register ──────────────────────────────────────────
    document.getElementById('registerForm').addEventListener('submit', async () => {
      hideMessages();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;

      if (!name) { showError('Please enter your full name.'); return; }
      if (!email || !email.includes('@')) { showError('Please enter a valid email address.'); return; }
      if (!password || password.length < 4) { showError('Password must be at least 4 characters.'); return; }
      if (password !== confirm) { showError('Passwords do not match.'); return; }

      const btn = document.getElementById('regBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Creating account...';

      try {
        const res = await fetch('/api/users/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name }),
        });
        const data = await res.json();

        if (data.success) {
          // Store email for approval-pending page
          localStorage.setItem('pendingEmail', email);
          localStorage.setItem('pendingPassword', password);
          showSuccess('✅ Account created! Redirecting to approval page...');
          setTimeout(() => { window.location.href = '/approval-pending'; }, 1500);
        } else {
          showError(data.error || 'Registration failed. Please try again.');
        }
      } catch (err) {
        showError('Registration failed. Server may be starting up. Please wait and try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = '➕ Create Account';
      }
    });

    document.getElementById('regConfirm').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('registerForm').dispatchEvent(new Event('submit'));
    });

    // ─── Check if already logged in ────────────────────────
    const storedEmail = localStorage.getItem('adminEmail');
    const storedPw = localStorage.getItem('adminPassword');
    if (storedEmail && storedPw) {
      fetch('/api/users/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: storedEmail, password: storedPw }),
      }).then(r => r.json()).then(data => {
        if (data.valid) {
          const user = data.user || {};
          if (user.role === 'DEVELOPER') window.location.href = '/developer';
          else window.location.href = '/';
        }
      }).catch(() => {});
    }
  </script>
</body>
</html>

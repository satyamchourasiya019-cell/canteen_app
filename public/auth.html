<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Digital Canteen Book</title>
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f0f2f5;color:#1e293b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08);width:100%;max-width:420px;overflow:hidden}
    .login-header{background:linear-gradient(135deg,#1e40af 0%,#2563eb 100%);color:#fff;padding:32px 24px;text-align:center}
    .login-header .logo{font-size:2.5rem;margin-bottom:8px}
    .login-header h1{font-size:1.4rem;font-weight:700;margin-bottom:4px}
    .login-header p{font-size:0.85rem;opacity:0.85}
    .login-body{padding:28px 24px}
    .form-group{margin-bottom:18px}
    .form-group label{display:block;font-size:0.8rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
    .form-group input{width:100%;padding:14px 16px;font-size:1rem;font-weight:600;border:2px solid #e2e8f0;border-radius:10px;outline:none;transition:border-color 0.2s}
    .form-group input:focus{border-color:#2563eb}
    .form-group input.error{border-color:#dc2626}
    .login-btn{width:100%;padding:14px;font-size:1.05rem;font-weight:700;border:none;border-radius:10px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;cursor:pointer;transition:all 0.2s}
    .login-btn:hover{background:linear-gradient(135deg,#1d4ed8,#1e40af);transform:translateY(-1px)}
    .login-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
    .error-msg{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 16px;color:#dc2626;font-size:0.85rem;font-weight:600;margin-bottom:16px;display:none}
    .error-msg.show{display:block}
    .security-note{margin-top:20px;padding:12px 16px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;font-size:0.78rem;color:#0369a1;text-align:center}
    .security-note strong{display:block;margin-bottom:2px}
    .spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;margin-right:8px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="logo">🍽️</div>
      <h1>Digital Canteen Book</h1>
      <p>Admin Dashboard Login</p>
    </div>
    <div class="login-body">
      <div class="error-msg" id="errorMsg"></div>
      <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
          <label>Admin Password</label>
          <input type="password" id="password" placeholder="Enter admin password" required autocomplete="current-password" autofocus />
        </div>
        <button type="submit" class="login-btn" id="loginBtn">
          Sign In
        </button>
        <div style="text-align:center;margin-top:12px;">
          <a href="#" onclick="resetPassword()" style="color:#2563eb;font-size:0.85rem;text-decoration:none;">🔑 Forgot Password? Reset to default</a>
        </div>
      </form>
      <div class="security-note">
        <strong>🔒 Secure Access Only</strong>
        This dashboard is restricted to authorized administrators. All login attempts are logged.
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');
    const passwordInput = document.getElementById('password');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }

    function hideError() {
      errorMsg.classList.remove('show');
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      if (loading) {
        loginBtn.innerHTML = '<span class="spinner"></span>Signing in...';
      } else {
        loginBtn.textContent = 'Sign In';
      }
    }

    loginForm.addEventListener('submit', async () => {
      hideError();
      const password = passwordInput.value;

      if (!password) {
        showError('Please enter the admin password.');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch('/api/password/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });

        const data = await res.json();

        if (data.valid) {
          // Store password for API auth
          localStorage.setItem('adminPassword', password);
          localStorage.setItem('adminLoginTime', String(Date.now()));

          // Redirect to dashboard
          window.location.href = '/';
        } else {
          // Try to fetch the default password to show as hint
          let hint = '';
          try {
            const hintRes = await fetch('/api/password/default');
            const hintData = await hintRes.json();
            if (hintData.default) hint = hintData.default;
          } catch(e) {}
          if (hint) {
            showError('Incorrect password. The current admin password is: ' + hint + '\n\nIf you changed it, try that new password.');
          } else {
            showError('Incorrect password. Please try again.');
          }
          setLoading(false);
        }
      } catch (err) {
        console.error('Login error:', err);
        showError('Login failed. Server may be starting up. Please wait 30 seconds and try again.');
        setLoading(false);
      }
    });

    // Enter key support
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
    });

    // Check if already logged in
    const storedPw = localStorage.getItem('adminPassword');
    if (storedPw) {
      fetch('/api/password/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: storedPw }),
      }).then(r => r.json()).then(data => {
        if (data.valid) window.location.href = '/';
      }).catch(() => {});
    }

    // Also fetch and display default password as hint
    fetch('/api/password/default').then(r => r.json()).then(data => {
      if (data.default) {
        const note = document.querySelector('.security-note');
        if (note) note.innerHTML = '<strong>🔒 Secure Access Only</strong>Default password: <code style="background:#e2e8f0;padding:2px 8px;border-radius:4px;font-weight:700;">' + data.default + '</code><br>You can change this in Settings after login.';
      }
    }).catch(() => {});

    async function resetPassword() {
      const currentPw = prompt('Enter your current password to reset to default (988388):');
      if (!currentPw) return;
      try {
        const res = await fetch('/api/password/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword: currentPw }),
        });
        const data = await res.json();
        if (data.success) {
          alert('✅ Password reset to: 988388\n\nYou can now login with this password.');
          passwordInput.value = '988388';
        } else {
          alert('❌ ' + (data.error || 'Reset failed. Current password incorrect.'));
        }
      } catch (err) {
        alert('❌ Reset failed. Server may be starting up.');
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Digital Canteen Book</title>
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f0f2f5;color:#1e293b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08);width:100%;max-width:420px;overflow:hidden}
    .login-header{background:linear-gradient(135deg,#1e40af 0%,#2563eb 100%);color:#fff;padding:32px 24px;text-align:center}
    .login-header .logo{font-size:2.5rem;margin-bottom:8px}
    .login-header h1{font-size:1.4rem;font-weight:700;margin-bottom:4px}
    .login-header p{font-size:0.85rem;opacity:0.85}
    .login-body{padding:28px 24px}
    .form-group{margin-bottom:18px}
    .form-group label{display:block;font-size:0.8rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
    .form-group input{width:100%;padding:14px 16px;font-size:1rem;font-weight:600;border:2px solid #e2e8f0;border-radius:10px;outline:none;transition:border-color 0.2s}
    .form-group input:focus{border-color:#2563eb}
    .form-group input.error{border-color:#dc2626}
    .login-btn{width:100%;padding:14px;font-size:1.05rem;font-weight:700;border:none;border-radius:10px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;cursor:pointer;transition:all 0.2s}
    .login-btn:hover{background:linear-gradient(135deg,#1d4ed8,#1e40af);transform:translateY(-1px)}
    .login-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
    .create-btn{width:100%;padding:14px;font-size:1.05rem;font-weight:700;border:none;border-radius:10px;background:linear-gradient(135deg,#059669,#047857);color:#fff;cursor:pointer;transition:all 0.2s}
    .create-btn:hover{background:linear-gradient(135deg,#047857,#065f46);transform:translateY(-1px)}
    .create-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
    .error-msg{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 16px;color:#dc2626;font-size:0.85rem;font-weight:600;margin-bottom:16px;display:none;white-space:pre-line}
    .error-msg.show{display:block}
    .success-msg{background:#d1fae5;border:1px solid #6ee7b7;border-radius:8px;padding:12px 16px;color:#065f46;font-size:0.85rem;font-weight:600;margin-bottom:16px;display:none;white-space:pre-line}
    .success-msg.show{display:block}
    .tab-bar{display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:24px}
    .tab-btn{flex:1;padding:12px;font-size:0.95rem;font-weight:700;border:none;background:transparent;color:#64748b;cursor:pointer;transition:all 0.2s;border-bottom:3px solid transparent}
    .tab-btn.active{color:#2563eb;border-bottom-color:#2563eb}
    .tab-btn:hover:not(.active){color:#1e293b}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .security-note{margin-top:20px;padding:12px 16px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;font-size:0.78rem;color:#0369a1;text-align:center}
    .security-note strong{display:block;margin-bottom:2px}
    .spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;margin-right:8px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    .divider{text-align:center;margin:16px 0;position:relative}
    .divider::before{content:'';position:absolute;left:0;top:50%;width:100%;height:1px;background:#e2e8f0}
    .divider span{position:relative;background:#fff;padding:0 12px;color:#94a3b8;font-size:0.8rem}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="logo">🍽️</div>
      <h1>Digital Canteen Book</h1>
      <p>Admin Dashboard Access</p>
    </div>
    <div class="login-body">
      <!-- Tab Bar: Login / Create Account -->
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('login')">🔑 Login</button>
        <button class="tab-btn" onclick="switchTab('create')">➕ Create Account</button>
      </div>

      <!-- Messages -->
      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>

      <!-- ═══ LOGIN TAB ═══ -->
      <div class="tab-content active" id="loginTab">
        <form id="loginForm" onsubmit="return false;">
          <div class="form-group">
            <label>Admin Password</label>
            <input type="password" id="loginPassword" placeholder="Enter admin password" required autocomplete="current-password" autofocus />
          </div>
          <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
        </form>
        <div style="text-align:center;margin-top:12px;">
          <a href="#" onclick="resetPassword()" style="color:#2563eb;font-size:0.85rem;text-decoration:none;">🔑 Forgot Password?</a>
        </div>
      </div>

      <!-- ═══ CREATE ACCOUNT TAB ═══ -->
      <div class="tab-content" id="createTab">
        <form id="createForm" onsubmit="return false;">
          <div class="form-group">
            <label>Current Password (for verification)</label>
            <input type="password" id="createCurrentPw" placeholder="Enter current password" required autocomplete="current-password" />
          </div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="createNewPw" placeholder="Enter new password (min 4 characters)" required autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="createConfirmPw" placeholder="Confirm new password" required autocomplete="new-password" />
          </div>
          <button type="submit" class="create-btn" id="createBtn">✅ Create Account & Login</button>
        </form>
      </div>

      <div class="security-note" id="securityNote">
        <strong>🔒 Secure Access Only</strong>
        This dashboard is restricted to authorized administrators.
      </div>
    </div>
  </div>

  <script>
    // ─── Tab Switching ──────────────────────────────────────
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      hideMessages();

      if (tab === 'login') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('loginTab').classList.add('active');
        document.getElementById('loginPassword').focus();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('createTab').classList.add('active');
        document.getElementById('createCurrentPw').focus();
      }
    }

    // ─── Messages ──────────────────────────────────────────
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('successMsg').classList.remove('show');
    }
    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('errorMsg').classList.remove('show');
    }
    function hideMessages() {
      document.getElementById('errorMsg').classList.remove('show');
      document.getElementById('successMsg').classList.remove('show');
    }

    // ─── Login ─────────────────────────────────────────────
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    function setLoginLoading(loading) {
      loginBtn.disabled = loading;
      loginBtn.innerHTML = loading ? '<span class="spinner"></span>Signing in...' : 'Sign In';
    }

    loginForm.addEventListener('submit', async () => {
      hideMessages();
      const password = document.getElementById('loginPassword').value;
      if (!password) { showError('Please enter the admin password.'); return; }

      setLoginLoading(true);
      try {
        const res = await fetch('/api/password/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();

        if (data.valid) {
          localStorage.setItem('adminPassword', password);
          localStorage.setItem('adminLoginTime', String(Date.now()));
          window.location.href = '/';
        } else {
          let hint = '';
          try {
            const hintRes = await fetch('/api/password/default');
            const hintData = await hintRes.json();
            if (hintData.default) hint = hintData.default;
          } catch(e) {}
          if (hint) {
            showError('Incorrect password.\n\nCurrent password: ' + hint);
          } else {
            showError('Incorrect password. Please try again.');
          }
          setLoginLoading(false);
        }
      } catch (err) {
        showError('Login failed. Server may be starting up. Please wait and try again.');
        setLoginLoading(false);
      }
    });

    document.getElementById('loginPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
    });

    // ─── Create Account ────────────────────────────────────
    const createForm = document.getElementById('createForm');
    const createBtn = document.getElementById('createBtn');

    function setCreateLoading(loading) {
      createBtn.disabled = loading;
      createBtn.innerHTML = loading ? '<span class="spinner"></span>Creating account...' : '✅ Create Account & Login';
    }

    createForm.addEventListener('submit', async () => {
      hideMessages();
      const currentPw = document.getElementById('createCurrentPw').value;
      const newPw = document.getElementById('createNewPw').value;
      const confirmPw = document.getElementById('createConfirmPw').value;

      if (!currentPw) { showError('Please enter current password for verification.'); return; }
      if (!newPw || newPw.length < 4) { showError('New password must be at least 4 characters.'); return; }
      if (newPw !== confirmPw) { showError('New passwords do not match.'); return; }
      if (newPw === currentPw) { showError('New password must be different from current password.'); return; }

      setCreateLoading(true);
      try {
        // Step 1: Verify current password
        const verifyRes = await fetch('/api/password/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: currentPw }),
        });
        const verifyData = await verifyRes.json();

        if (!verifyData.valid) {
          showError('Current password is incorrect. Please verify and try again.');
          setCreateLoading(false);
          return;
        }

        // Step 2: Set new password
        const updateRes = await fetch('/api/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: newPw }),
        });
        const updateData = await updateRes.json();

        if (updateData.success) {
          // Step 3: Login with new password
          localStorage.setItem('adminPassword', newPw);
          localStorage.setItem('adminLoginTime', String(Date.now()));
          showSuccess('✅ Account created successfully!\n\nRedirecting to dashboard...');
          setTimeout(() => { window.location.href = '/'; }, 1000);
        } else {
          showError('Failed to set new password. Please try again.');
          setCreateLoading(false);
        }
      } catch (err) {
        showError('Network error. Server may be starting up. Please wait and try again.');
        setCreateLoading(false);
      }
    });

    document.getElementById('createConfirmPw').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') createForm.dispatchEvent(new Event('submit'));
    });

    // ─── Forgot Password ───────────────────────────────────
    async function resetPassword() {
      const currentPw = prompt('Enter your current password to reset to default (988388):');
      if (!currentPw) return;
      try {
        const res = await fetch('/api/password/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword: currentPw }),
        });
        const data = await res.json();
        if (data.success) {
          alert('✅ Password reset to: 988388\n\nYou can now login with this password.');
          document.getElementById('loginPassword').value = '988388';
          switchTab('login');
        } else {
          alert('❌ ' + (data.error || 'Reset failed. Current password incorrect.'));
        }
      } catch (err) {
        alert('❌ Reset failed. Server may be starting up.');
      }
    }

    // ─── Check if already logged in ────────────────────────
    const storedPw = localStorage.getItem('adminPassword');
    if (storedPw) {
      fetch('/api/password/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: storedPw }),
      }).then(r => r.json()).then(data => {
        if (data.valid) window.location.href = '/';
      }).catch(() => {});
    }

    // ─── Fetch and display default password hint ────────────
    fetch('/api/password/default').then(r => r.json()).then(data => {
      if (data.default) {
        const note = document.getElementById('securityNote');
        if (note) note.innerHTML = '<strong>🔒 Secure Access Only</strong>Default password: <code style="background:#e2e8f0;padding:2px 8px;border-radius:4px;font-weight:700;">' + data.default + '</code><br>You can change this after login in Settings.';
      }
    }).catch(() => {});
  </script>
</body>
</html>
